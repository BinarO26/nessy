name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli

      - name: Build NESSY Web
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

      - name: Generate WASM bindings
        run: |
          mkdir -p dist
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/nessy_web.wasm \
            --out-dir dist \
            --target web

      - name: Create HTML
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NESSY</title>
          </head>
          <body>
            <script type="module">
              import init from "./nessy_web.js";

              init();
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
